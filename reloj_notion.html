<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reloj para Notion</title>
<style>
  :root{
    --bg: #0b0b0b;
    --card: #151515;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:transparent;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .wrap{
    width:100%;
    height:100%;
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }

  .clock{
    background:var(--bg);
    border-radius:18px;
    padding:18px 20px 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    display:flex;
    align-items:flex-end;
    gap:10px;
    width:max-content;
    max-width:100%;
  }

  .digits{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .pair{
    display:flex;
    gap:6px;
  }

  .card{
    width:64px;
    height:86px;
    border-radius:var(--radius);
    background:var(--card);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
    font-weight:700;
    line-height:1;
    position:relative;
    overflow:hidden;
    box-shadow: inset 0 -1px 0 rgba(255,255,255,.03);
  }

  .card::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:1px;
    background:rgba(255,255,255,.06);
  }

  .sep{
    color:var(--muted);
    font-size:42px;
    line-height:1;
    margin:0 1px 18px;
  }

  .ampm{
    color:var(--text);
    font-size:16px;
    font-weight:700;
    min-width:26px;
    margin:0 0 10px 2px;
    letter-spacing:.04em;
  }

  .date{
    color:var(--muted);
    font-size:12px;
    margin-top:8px;
    text-align:center;
    letter-spacing:.02em;
  }

  .column{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  @media (max-width: 520px){
    .clock{ padding:14px 14px 12px; gap:6px; }
    .digits{ gap:6px; }
    .pair{ gap:4px; }
    .card{ width:50px; height:70px; font-size:46px; border-radius:12px; }
    .sep{ font-size:34px; margin-bottom:15px; }
    .ampm{ font-size:13px; margin-bottom:8px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="column">
      <div class="clock" aria-label="Reloj">
        <div class="digits">
          <div class="pair">
            <div class="card" id="h1">0</div>
            <div class="card" id="h2">7</div>
          </div>
          <div class="sep">:</div>
          <div class="pair">
            <div class="card" id="m1">4</div>
            <div class="card" id="m2">0</div>
          </div>
        </div>
        <div class="ampm" id="ampm">PM</div>
      </div>
      <div class="date" id="date"></div>
    </div>
  </div>

<script>
  const TIME_ZONE = "America/Argentina/Cordoba";

  function partsFor(date){
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: TIME_ZONE,
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    });

    const parts = fmt.formatToParts(date);
    const get = t => parts.find(p => p.type === t)?.value || "";

    return {
      hour: get("hour").padStart(2, "0"),
      minute: get("minute").padStart(2, "0"),
      dayPeriod: get("dayPeriod")
    };
  }

  function updateClock(){
    const now = new Date();
    const t = partsFor(now);

    document.getElementById("h1").textContent = t.hour[0];
    document.getElementById("h2").textContent = t.hour[1];
    document.getElementById("m1").textContent = t.minute[0];
    document.getElementById("m2").textContent = t.minute[1];
    document.getElementById("ampm").textContent = t.dayPeriod;

    const df = new Intl.DateTimeFormat("es-AR", {
      timeZone: TIME_ZONE,
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    let text = df.format(now);
    document.getElementById("date").textContent =
      text.charAt(0).toUpperCase() + text.slice(1);
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
